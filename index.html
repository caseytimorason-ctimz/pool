<meta charset="utf-8">
<title>Rack Sheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@0,400;0,500;0,600;0,700&display=swap">
<style>
:root{
  --bg:#eef1f4; --panel:#ffffff; --panel-2:#f5f7f9; --ink:#1b2430; --ink-soft:#5a6b7b;
  --line:#dae1e8; --line-2:#e9eef2;
  --accent:#1f7a8c; --accent-ink:#0e4d5a;
  --good:#2f8f5b; --good-wash:#e4f3ea; --bad:#c0483b; --bad-wash:#f7e5e2;
  --even:#7c8b99; --even-wash:#eef1f4; --warn:#b8791f;
  --diamond:#243447;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 6px 18px rgba(20,30,40,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --panel:#161f28; --panel-2:#1b2732; --ink:#e7edf2; --ink-soft:#93a4b3;
  --line:#26333f; --line-2:#1f2b35;
  --accent:#4bb6c9; --accent-ink:#a7e0e9;
  --good:#4bbd7f; --good-wash:#12301f; --bad:#e0715f; --bad-wash:#331812;
  --even:#8296a6; --even-wash:#1b2732; --warn:#d8a24a;
  --diamond:#9db4c9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0e141b; --panel:#161f28; --panel-2:#1b2732; --ink:#e7edf2; --ink-soft:#93a4b3;
  --line:#26333f; --line-2:#1f2b35;
  --accent:#4bb6c9; --accent-ink:#a7e0e9;
  --good:#4bbd7f; --good-wash:#12301f; --bad:#e0715f; --bad-wash:#331812;
  --even:#8296a6; --even-wash:#1b2732; --warn:#d8a24a;
  --diamond:#9db4c9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Oswald,system-ui,sans-serif;font-weight:600;letter-spacing:.01em;margin:0}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 72px}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.head-in{max-width:820px;margin:0 auto;padding:11px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto}
.mark{width:24px;height:24px;transform:rotate(45deg);border-radius:5px;background:linear-gradient(135deg,var(--accent),var(--accent-ink));flex:0 0 auto}
.brand b{font-family:Oswald;font-size:19px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{color:var(--ink-soft);font-size:11px;letter-spacing:.13em;text-transform:uppercase;display:block;margin-top:1px}
.tabs{display:flex;gap:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;
  overflow-x:auto;flex:0 1 auto;min-width:0;scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:Oswald;text-transform:uppercase;letter-spacing:.04em;font-size:13px;border:0;background:transparent;
  color:var(--ink-soft);padding:7px 13px;border-radius:7px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.tab .sm{display:none}
.tab[aria-selected="true"]{background:var(--accent);color:#fff}
.theme-btn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink-soft);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:16px 0 6px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft);flex:1 1 auto;min-width:180px}
select,input[type=search]{font-family:Barlow;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
select:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 15px;margin:12px 0}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.sub{color:var(--ink-soft);font-size:13px;margin:3px 0 0}

/* SL diamond */
.sl{display:inline-grid;place-items:center;width:21px;height:21px;flex:0 0 auto;background:var(--diamond);color:var(--panel);border-radius:4px;transform:rotate(45deg)}
.sl i{transform:rotate(-45deg);font-style:normal;font-family:Oswald;font-weight:600;font-size:11px}

/* opponent block (matchup) */
.opp{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.opp:first-child{border-top:0;margin-top:4px;padding-top:0}
.opp-hd{display:flex;align-items:baseline;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.opp-hd .nm{font-family:Oswald;font-size:18px;font-weight:600;line-height:1.15}
.opp-hd .tag{margin-left:auto;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em}

/* ranked row */
.rk{display:grid;grid-template-columns:20px 22px 1fr 52px;align-items:center;gap:9px;padding:6px 8px;border-radius:9px}
.rk+.rk{margin-top:2px}
.rk .pos{font-family:Oswald;font-size:12px;color:var(--ink-soft);text-align:right}
.rk .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.rk .nm.two{display:flex;flex-direction:column;gap:1px;white-space:normal;overflow:visible;min-width:0}
.rk .nm.two .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .nm .h2h{font-size:11px;color:var(--accent-ink);font-weight:600;margin-left:6px;flex:0 0 auto;white-space:nowrap}
.rk .nm .h2h.unrated{color:var(--warn)}
.rk .pv{font-family:Oswald;font-weight:700;font-size:18px;text-align:right}
.rk .pv-u{font-family:Barlow;font-size:9px;font-weight:600;color:var(--ink-soft);display:block;margin-top:-2px}
.rk.best{background:var(--good-wash)}
.rk .barw{grid-column:2/4;height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:5px}
.win{color:var(--good)}.lose{color:var(--bad)}.evn{color:var(--even)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:middle}
/* Identity control. A plain <select> read as a passive form field and teammates didn't
   realise the name was theirs to change, so the native select is kept (for the OS picker)
   but made invisible over a loud, obviously-tappable face showing SL badge + name. */
.pick{position:relative;width:100%}
.pick select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.pick-face{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;
  background:var(--accent-wash);border:1.5px solid var(--accent);box-shadow:var(--shadow);pointer-events:none}
.pick-who{display:flex;align-items:center;gap:9px;font-family:Oswald;font-size:19px;font-weight:600;
  color:var(--ink);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-cta{margin-left:auto;display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;
  font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);
  border:1px solid var(--accent);border-radius:999px;padding:4px 9px;background:var(--panel)}
.pick-cta .chev{font-size:11px;line-height:1}
.pick select:focus-visible + .pick-face,.pick:focus-within .pick-face{outline:2px solid var(--accent);outline-offset:2px}
/* match variant: two-line — when it is, then who against */
.pick-match{display:flex;flex-direction:column;gap:1px;min-width:0}
.pick-when{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.pick-vs{font-family:Oswald;font-size:18px;font-weight:600;color:var(--ink);line-height:1.15}
.pick-vs .fmt{font-family:Barlow;font-size:11px;font-weight:600;color:var(--ink-soft);margin-left:7px}
/* qualification tracker */
.qt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:10px}
table.qt{border-collapse:collapse;min-width:100%;font-size:13px}
table.qt th,table.qt td{padding:9px 10px;border-bottom:1px solid var(--line-2);text-align:center;white-space:nowrap}
table.qt th{font-family:Oswald;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-soft);background:var(--panel-2);position:sticky;top:0}
table.qt td.who,table.qt th.who{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1;box-shadow:1px 0 0 var(--line)}
table.qt th.who{background:var(--panel-2);z-index:2}
table.qt td.who .nm{display:flex;align-items:center;gap:7px;font-weight:500}
.qchip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);background:var(--panel-2)}
.qchip.yes{background:var(--good-wash);color:var(--good);border-color:var(--good)}
.qchip.close{background:var(--warn-wash,rgba(184,121,31,.14));color:var(--warn);border-color:var(--warn)}
.qchip.no{background:var(--panel-2);color:var(--ink-soft)}
.qchip.unknown{border-style:dashed}
.qt-sub{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:400;margin-top:2px}
.bl-sec{border:1px solid var(--line);border-radius:11px;margin-top:8px;background:var(--panel-2);overflow:hidden}
.bl-sec>summary{cursor:pointer;list-style:none;padding:11px 13px;font-family:Oswald;font-size:13px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bl-sec>summary::-webkit-details-marker{display:none}
.bl-sec>summary::after{content:'+';font-size:16px;color:var(--ink-soft);font-weight:400}
.bl-sec[open]>summary::after{content:'\2212'}
.bl-sec[open]>summary{border-bottom:1px solid var(--line)}
.bl-body{padding:10px 13px 13px}
.bl-body p{font-size:13.5px;line-height:1.55;color:var(--ink-soft);margin:0 0 8px}
.bl-body p.bullet{padding-left:14px;text-indent:-14px}
.bl-body p:last-child{margin-bottom:0}
.bl-body mark{background:var(--warn);color:#fff;border-radius:3px;padding:0 2px}
.bl-hit{font-size:11px;color:var(--ink-soft);font-weight:400;letter-spacing:0;text-transform:none}
.rulebox{border:1px dashed var(--line);border-radius:11px;padding:12px 13px;margin-top:10px;background:var(--panel-2)}
.rulebox h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.rulebox p{font-size:13px;color:var(--ink-soft);margin:0}
/* hot streak — NBA Jam energy, but the dates stay honest: a 3-game run from last spring
   is not "on fire", so anything older than the recency window is called out as stale. */
.streaks{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.strk{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
  padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel-2)}
.opp-hd .tag.new{margin-left:8px;background:var(--warn);color:#fff;padding:1px 7px;border-radius:999px;font-weight:700}
.strk.heat{border-color:#d81f6a;background:linear-gradient(90deg,rgba(216,31,106,.22),rgba(255,180,60,.06))}
.strk.fire{border-color:#e2622a;background:linear-gradient(90deg,rgba(226,98,42,.18),rgba(226,98,42,.04))}
.strk.warm{border-color:var(--warn);background:linear-gradient(90deg,rgba(184,121,31,.14),transparent)}
.strk.cold{border-color:#4a7fa8;background:linear-gradient(90deg,rgba(74,127,168,.14),transparent)}
.strk-badge{font-family:Oswald;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;white-space:nowrap;color:#fff}
.strk.heat .strk-badge{background:linear-gradient(135deg,#ff5f6d,#d81f6a);box-shadow:0 0 10px rgba(216,31,106,.5)}
.strk.fire .strk-badge{background:linear-gradient(135deg,#f0913a,#d8412a)}
.strk.warm .strk-badge{background:var(--warn)}
.strk.cold .strk-badge{background:#4a7fa8}
.strk-nm{display:flex;flex-direction:column;gap:2px;min-width:0;font-weight:600}
.strk-top{display:flex;align-items:center;gap:8px;min-width:0}
.strk-top .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strk-sub{font-size:11.5px;color:var(--ink-soft);font-weight:400;line-height:1.3}
.pips{display:flex;gap:3px;flex:0 0 auto}
.pip{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;
  font-family:Oswald;font-size:9px;font-weight:700;color:#fff}
.pip.w{background:var(--good)} .pip.l{background:var(--bad);opacity:.85}
@media(max-width:430px){.strk{grid-template-columns:auto 1fr}.pips{grid-column:1/-1;margin-top:2px}}
/* first-run "who are you" roster picker — tappable names, not a dropdown to discover */
.whogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.whobtn{display:flex;align-items:center;gap:9px;text-align:left;padding:12px 13px;cursor:pointer;
  background:var(--panel-2);border:1px solid var(--line);border-radius:11px;color:var(--ink);
  font-family:Barlow;font-size:15px;font-weight:500}
.whobtn:hover{border-color:var(--accent);background:var(--accent-wash)}
.whobtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:11.5px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .dot{margin-left:0}
.d-high{background:var(--good)}.d-med{background:var(--warn)}.d-low{background:var(--bad);opacity:.6}

/* player header */
.phd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phd .nm{font-family:Oswald;font-size:22px;font-weight:600}
.phd .stat{font-size:14px;color:var(--ink-soft)}
.ftabs{display:flex;gap:4px;margin:10px 0 2px}
.ftab{font-family:Oswald;text-transform:uppercase;font-size:12px;letter-spacing:.05em;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-soft);padding:5px 12px;border-radius:7px;cursor:pointer}
.ftab[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

/* own-SL filter chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-family:Oswald;font-size:13px;letter-spacing:.03em;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-soft);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--diamond);color:var(--panel);border-color:var(--diamond)}
.chip{display:inline-flex;align-items:center;gap:6px}
.chip.avail[aria-pressed="false"]{opacity:.45;text-decoration:line-through}

/* vs-SL grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:4px}
.cell{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.cell .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.cell .v{font-family:Oswald;font-weight:600;font-size:18px;margin:1px 0}
.cell .n{font-size:11px}
.cell.thin{opacity:.6;border-style:dashed}
/* Every bar carries a tick at 50% — in a handicapped APA race that IS the expectation,
   so "past the tick" reads instantly as beating the spot, short of it as under. */
.barm{height:4px;border-radius:3px;background:var(--line);margin-top:5px;position:relative;overflow:hidden}
.barm i{display:block;height:100%}
.barm::after{content:"";position:absolute;left:50%;top:-1px;bottom:-1px;width:1px;background:var(--ink-soft);opacity:.55}
.barw{position:relative}
.barw::after{content:"";position:absolute;left:50%;top:-1px;bottom:-1px;width:1px;background:var(--ink-soft);opacity:.5;z-index:1}

/* H2H table */
.h2h-tools{display:flex;gap:8px;align-items:center;margin:6px 0 8px}
.h2h-tools input{max-width:220px;padding:8px 10px}
table.h2h{width:100%;border-collapse:collapse;font-size:14px}
table.h2h th{text-align:left;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
table.h2h td{padding:8px 6px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.h2h tr.op{cursor:pointer}
table.h2h tr.op:hover{background:var(--panel-2)}
table.h2h td.rec{font-family:Oswald;font-weight:600;text-align:right;white-space:nowrap}
table.h2h th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
table.h2h th.sortable:hover{color:var(--ink)}
table.h2h th.sorted{color:var(--accent-ink)}
table.h2h th .arrow{font-size:9px}

/* team overview grid */
.tt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table.tt{border-collapse:collapse;font-size:13px;min-width:100%}
table.tt th,table.tt td{padding:9px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line-2)}
table.tt th{font-family:Oswald;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);
  font-weight:600;background:var(--panel-2);position:sticky;top:0}
table.tt td.who,table.tt th.who{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1;
  box-shadow:1px 0 0 var(--line)}
table.tt th.who{background:var(--panel-2);z-index:2}
table.tt td.who .nm{display:flex;align-items:center;gap:7px;font-weight:500}
table.tt td.cell{font-family:Oswald;font-weight:600}
table.tt td.cell .n{display:block;font-family:Barlow;font-weight:400;font-size:10px;color:var(--ink-soft)}
table.tt td.cell.thin{opacity:.55}
table.tt td.empty{color:var(--line);font-weight:400}
table.tt tr:hover td{background:var(--panel-2)}
table.tt tr:hover td.who{background:var(--panel-2)}
.log{font-size:12.5px;color:var(--ink-soft)}
.log div{padding:2px 0}
.right{text-align:right}
.muted{color:var(--ink-soft)}
.foot{color:var(--ink-soft);font-size:12px;text-align:center;margin-top:24px;line-height:1.6}
.hide{display:none!important}
@media(max-width:560px){
  /* On a phone the four tabs + wordmark + theme button overflowed the header and clipped
     the last tab entirely (it was unreachable). Drop the wordmark to the diamond mark and
     tighten the tabs so all four fit; .tabs can still scroll if a label grows. */
  /* All four tabs must be visible without horizontal scrolling — a tab you can only reach
     by swiping the strip is a tab nobody finds. Shorten the two longest labels instead. */
  .brand{display:none}
  .tabs{margin-right:auto}
  .head-in{gap:8px;padding:10px 12px}
  .tab{padding:7px 7px;font-size:11.5px;letter-spacing:0}
  .tab .lg{display:none}
  .tab .sm{display:inline}
  .theme-btn{width:30px;height:30px;flex:0 0 auto}
  .rk .pv{font-size:16px}.phd .nm{font-size:19px}
}

.lu-head{display:flex;justify-content:space-between;align-items:center;margin:10px 0;padding:10px 12px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:10px;font-size:15px}
.lu-head b{font-family:Oswald;font-size:22px;color:var(--accent-ink)}
.lu-cap{font-family:Oswald;font-weight:700;font-size:13px;color:var(--ink-soft);letter-spacing:.04em}
.lu-cap.over{color:var(--bad)}
.lu-pairs{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.lu-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  padding:8px 10px;border:1px solid var(--line-2);border-radius:9px}
.lu-us{display:flex;align-items:center;gap:7px;min-width:0}
.lu-them{display:flex;align-items:center;gap:7px;min-width:0;justify-content:flex-end;text-align:right;color:var(--ink-soft)}
.lu-us .who,.lu-them .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu-pct{font-family:Oswald;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.lu-alt{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:12.5px;
  padding:9px 8px;border:0;border-bottom:1px solid var(--line-2);background:transparent;color:var(--ink-soft);
  width:100%;text-align:left;cursor:pointer;font-family:inherit}
.lu-alt:last-child{border-bottom:0}
.lu-alt:hover{background:var(--panel-2)}
.lu-alt b{font-family:Oswald;color:var(--ink);font-size:15px}

<script>window.APA_DATA=null;</script>
<script>
let D,P,B,PL,GAP={};
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const sl=n=>`<span class="sl"><i>${n}</i></span>`;
// niceDate (defined with the matchup code below) drops the year, which is fine for a match
// three days out but not for a tournament date; this adds it back.
function fmtDate(d){
  if(!d)return '';
  const parts=String(d).split('-');
  if(parts.length<3)return `${MON[(+parts[1]||1)-1]} ${parts[0]}`;
  return `${niceDate(d)}, ${parts[0]}`;
}
const K_SL=8,K_H2H=1.5,K_NEW=10,K_BASE=30,H2H_CAP=0.9,CAL_SHRINK=0.30;
const cls=p=>p>=.55?'win':p<=.45?'lose':'evn';

// The SL-vs-SL handicap curve, per format, as a function of skill-level GAP (A.sl - Q.sl),
// built once from the well-sampled baseline cells. This is what thin/flukey cells regress
// toward instead of a flat 0.50 — and it captures that 9-ball's handicap nearly equalizes
// every gap (~0.50) while 8-ball stays skill-dominated (a 4-gap is ~0.76 for the stronger
// player). Sparse gaps clamp to the nearest well-sampled one.
function buildGapPriors(bl){
  const out={};
  for(const fmt in bl){
    const agg={};
    for(const k in bl[fmt]){const [a,q]=k.split('-').map(Number);const [w,n]=bl[fmt][k];
      if(n<40)continue; const g=a-q; (agg[g]=agg[g]||[0,0]); agg[g][0]+=w*n; agg[g][1]+=n;}
    const known={}; for(const g in agg)known[g]=agg[g][0]/agg[g][1];
    const gs=Object.keys(known).map(Number).sort((a,b)=>a-b);
    const curve={};
    for(let g=-8;g<=8;g++){
      if(known[g]!=null){curve[g]=known[g];continue;}
      if(!gs.length){curve[g]=0.5;continue;}
      if(g<gs[0])curve[g]=known[gs[0]]; else if(g>gs[gs.length-1])curve[g]=known[gs[gs.length-1]];
      else curve[g]=known[gs.reduce((b,x)=>Math.abs(x-g)<Math.abs(b-g)?x:b,gs[0])];
    }
    out[fmt]=curve;
  }
  return out;
}
function gapPrior(A,Q,fmt){const c=GAP[fmt]; if(!c)return 0.5; const g=Math.max(-8,Math.min(8,A.sl-Q.sl)); return c[g]!=null?c[g]:0.5;}

/* engine: P(A beats Q) + evidence for confidence + direct H2H tag */
function score(A,Q,fmt){
  const base=(B[fmt]||{})[`${A.sl}-${Q.sl}`]||[0.5,0];
  // Shrink the SL-vs-SL baseline toward an even match by its sample size. Some extreme-gap
  // cells rest on a handful of league games (e.g. a 3 "beats" a 9 80% from just 5 games, while
  // the well-sampled 3-vs-8 and 4-vs-9 cells show the underdog losing badly) — taking a flukey
  // rate at face value is what made the engine want to spend a 3 on a 9. Well-sampled cells
  // (hundreds of games) are essentially unchanged.
  const nB=base[1]||0, prior=gapPrior(A,Q,fmt);
  let p=prior+(base[0]-prior)*(nB/(nB+K_BASE)),ev=0,h2h=null;
  const prof=P[`${A.mid}:${fmt}`];
  if(prof){
    const cell=(prof.predictiveVsSL||[]).find(c=>c.vsSL===Q.sl);
    if(cell&&cell.games){const w=cell.wins/cell.games,wt=cell.games/(cell.games+K_SL);p=(1-wt)*p+wt*w;ev+=cell.games;}
    // BUGFIX: oppMid is a string (from the CSV pipeline) but roster mid is an integer (from
    // the API), so `===` silently never matched and head-to-head records applied to NOBODY.
    // Coerce both sides. A direct record vs this exact opponent is the single best signal we
    // have, so it also carries more weight than a generic SL-vs-SL baseline (which can rest on
    // only a handful of league-wide games): cap raised, and it climbs faster with meetings.
    const h=(prof.headToHead||[]).find(x=>String(x.oppMid)===String(Q.mid));
    if(h&&h.meetings){const w=h.wins/h.meetings,wt=Math.min(H2H_CAP,h.meetings/(h.meetings+K_H2H));p=(1-wt)*p+wt*w;ev+=h.meetings*2;h2h=h;}
  }
  // Unrated players: a brand-new player is entered at SL3 by default, so the SL-vs-SL baseline
  // (e.g. a 3 is "80% vs a 9" on the handicap) is a fiction — we have no evidence they can
  // actually run a rack. Pull their number toward a coin flip in proportion to how little we
  // know, so an unrated 3 doesn't outrank a proven pick on borrowed confidence. A direct
  // head-to-head record (rare for a new player) is real evidence and is left to stand.
  const games=prof?(prof.totalGames||0):0;
  const unrated=!!A.new || games<K_NEW;
  if(unrated && !(h2h&&h2h.meetings>=3)){
    const known=Math.min(games,K_NEW)/K_NEW;   // 0 games -> fall back to the SL/handicap prior
    p=prior+(p-prior)*known;
  }
  // CALIBRATION (from the point-in-time backtest, pipeline/backtest.py): raw model win-odds are
  // badly over-confident — a raw 78% actually wins ~55%, because APA handicapping makes matches
  // near coin-flips. Shrink the displayed odds toward 50% so the number means what it says
  // (Brier 0.262 -> 0.248). This is monotonic, so it never changes WHO ranks above whom — only
  // how confident the % reads. The pre-shrink signal still drives the ranking and the game tree.
  p=0.5+(p-0.5)*CAL_SHRINK;
  return {p,conf:ev>=12?'high':ev>=5?'med':'low',h2h,unrated};
}

// A proven, well-sampled OUTLIER record vs this exact opponent — the case where someone just
// has another player's game figured out. Returns a strength score (0 = none). It fires only
// when the record is real (>=3 meetings, winning) AND clearly beats how the field does against
// that opponent, so a strong 9 who loses to one specific person is caught. This is treated as
// the recommendation regardless of the handicap EV, because a direct record like that is the
// strongest signal in the game.
function provenEdge(A,Q,fmt){
  const prof=P[`${A.mid}:${fmt}`]; if(!prof)return 0;
  const h=(prof.headToHead||[]).find(x=>String(x.oppMid)===String(Q.mid));
  if(!h||h.meetings<3)return 0;
  const wr=h.wins/h.meetings; if(wr<0.6)return 0;
  const qp=P[`${Q.mid}:${fmt}`];
  const field=(qp&&qp.totalGames)?(1-qp.wins/qp.totalGames):0.5;  // how everyone else does vs Q
  const edge=wr-field;
  return edge>=0.2 ? edge*Math.min(h.meetings,10) : 0;
}

// Plain-English reasoning for one pairing, built from the same pieces score() uses. Only runs
// when a cell is expanded, so it can afford to re-derive and narrate.
function explain(A,Q,fmt){
  const cell=(B[fmt]||{})[`${A.sl}-${Q.sl}`]||[0.5,0];
  const prior=gapPrior(A,Q,fmt), nB=cell[1]||0;
  const shrunk=prior+(cell[0]-prior)*(nB/(nB+K_BASE));
  const out=[];
  const gapTxt = fmt==='9'
    ? 'In 9-ball the handicap nearly evens out skill-level gaps'
    : (A.sl>Q.sl?'In 8-ball the higher skill level is favored'
       :A.sl<Q.sl?'In 8-ball the lower skill level is the underdog':'Evenly matched on skill');
  out.push(`Handicap start: SL ${A.sl} vs SL ${Q.sl}. ${gapTxt}, so begin around ${Math.round(shrunk*100)}%.`);
  const prof=P[`${A.mid}:${fmt}`];
  const games=prof?prof.totalGames||0:0;
  let hadH2H=false;
  if(prof){
    const c=(prof.predictiveVsSL||[]).find(x=>x.vsSL===Q.sl);
    if(c&&c.games)out.push(`Record vs SL ${Q.sl} at their current level: ${c.wins}-${c.games-c.wins} (${Math.round(100*c.wins/c.games)}%).`);
    const h=(prof.headToHead||[]).find(x=>String(x.oppMid)===String(Q.mid));
    if(h&&h.meetings){hadH2H=true;
      out.push(`Head-to-head vs ${esc(Q.name)}: ${h.wins}-${h.meetings-h.wins}${h.meetings>=3?' — a real sample, weighted heavily':' — small sample so far'}.`);
    }
  }
  const edge=provenEdge(A,Q,fmt);
  if(edge>0){
    const qp=P[`${Q.mid}:${fmt}`];
    const field=(qp&&qp.totalGames)?Math.round(100*qp.wins/qp.totalGames):null;
    out.push(`${esc(Q.name)}${field?` wins about ${field}% against everyone else`:' usually wins'}, but not against ${esc(A.name)} — a proven edge, so this is the pick even when the raw odds tip elsewhere.`);
  }
  if((A.new||games<K_NEW)&&!hadH2H)
    out.push(`No real track record yet (unrated) — this leans on the handicap, so treat it as a guess.`);
  const ep=expPts(A,Q,fmt), M=PMOM[fmt];
  if(prof && prof.nPtsWin>=10){
    const tallWin=prof.avgPtsWin>M.win.m+0.6, tallLoss=prof.avgPtsLoss>M.loss.m+0.6, lowLoss=prof.avgPtsLoss<M.loss.m-0.6;
    if(tallWin||tallLoss||lowLoss)
      out.push(`Margins: ${esc(A.name.split(' ')[0])} `+
        (tallWin?`wins big (${prof.avgPtsWin} pts vs ${M.win.m} avg when winning)`:'')+
        ((tallWin&&(tallLoss||lowLoss))?', and ':'')+
        (tallLoss?`stays in it losing (${prof.avgPtsLoss} pts)`:lowLoss?`gets buried when losing (${prof.avgPtsLoss} pts)`:'')+`.`);
  }
  out.push(`Bottom line: about ${Math.round(score(A,Q,fmt).p*100)}% to win, ~${Math.round(ep.m)} of ${M.total} match points — APA handicapping keeps matches close to a coin-flip, so even a real edge is a few points.`);
  return out;
}
// Make a ranked row expandable to show the reasoning. Toggles a .why panel right after it.
function attachWhy(rowEl,A,Q,fmt){
  rowEl.classList.add('clickable');
  rowEl.setAttribute('title','Tap for the reasoning');
  rowEl.addEventListener('click',ev=>{
    if(ev.target.closest('button'))return;   // don't hijack buttons inside the row
    const nx=rowEl.nextSibling;
    if(nx&&nx.classList&&nx.classList.contains('why')){nx.remove();return;}
    const w=el('div','why');
    explain(A,Q,fmt).forEach((t,i)=>{const pr=el('p',i===0?'why-lead':null);pr.innerHTML=t;w.appendChild(pr);});
    rowEl.after(w);
  });
}

// ---------- POINTS MODEL: the team match is decided on TOTAL match points, not match count ----------
// 9-ball splits 20 points a match (winner 12-20, loser 0-8); 8-ball splits 3 (winner 2-3, loser 0-1).
// Five matches, so the pool is 100 / 15 and you win the team match with more than half. Means and
// spreads below are measured from history (pipeline): what a player banks winning vs losing. This
// is why margin matters — losing on the hill (8) vs getting swept (0) is a real swing.
const PMOM={
  '9':{total:20,matches:5,win:{m:14.4,sd:1.9},loss:{m:5.6,sd:2.6},splits:[20,19,18,17,16,15,14,13,12]},
  '8':{total:3, matches:5,win:{m:2.4, sd:0.5},loss:{m:0.6, sd:0.5},splits:[3,2]}
};
function teamNeed(fmt){const M=PMOM[fmt]; return Math.floor(M.total*M.matches/2)+1;}
// erf-based normal CDF (Abramowitz-Stegun 7.1.26) for P(total points >= need)
function normCdf(z){
  const t=1/(1+0.3275911*Math.abs(z));
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-z*z);
  return z>=0 ? 0.5*(1+y) : 0.5*(1-y);
}
// Expected match points (and variance) our player A earns against Q — derived from the calibrated
// win probability and the win/loss point moments. E[pts]=p*winMean+(1-p)*lossMean.
const K_MARG=15;  // shrink a player's win/loss point margins toward the league mean by sample
function expPts(A,Q,fmt){
  const M=PMOM[fmt], p=score(A,Q,fmt).p, prof=P[`${A.mid}:${fmt}`];
  // V2: how many points THIS player banks when winning vs losing (does he win big / lose close?),
  // shrunk toward the league win/loss means by how much of a record he has. This is the margin
  // signal — the win probability p already handles win-vs-lose; these set the magnitude.
  const sh=(obs,n,base)=>(obs==null||!n)?base:base+(obs-base)*(n/(n+K_MARG));
  const wm=sh(prof&&prof.avgPtsWin, prof&&prof.nPtsWin, M.win.m);
  const lm=sh(prof&&prof.avgPtsLoss, prof&&prof.nPtsLoss, M.loss.m);
  const m=p*wm+(1-p)*lm;
  const v=p*(M.win.sd*M.win.sd+wm*wm)+(1-p)*(M.loss.sd*M.loss.sd+lm*lm)-m*m;
  return {m, v:Math.max(v,0.01), p, wm, lm};
}
// Points banked so far this match (from entered results), our side and theirs.
function teamScore(m){
  const M=PMOM[m.fmt]; let us=0, them=0;
  (live.played||[]).forEach(x=>{ if(x.ourPts!=null){ us+=x.ourPts; them+=(M.total-x.ourPts); }});
  return {us, them, matchesLeft:M.matches-(live.played||[]).length};
}
// P(win the team match) if we play matchup {A,Q} now and the remaining matches land near their
// expected points. Shifts the advice with the score: behind -> upside/variance helps; ahead ->
// the steady high-mean pick maxes it out.
function pTeamWin(m, A, Q, restPool){
  const fmt=m.fmt, M=PMOM[fmt], need=teamNeed(fmt), sc=teamScore(m);
  const here=expPts(A,Q,fmt);
  // remaining matches after this one: pair the leftover pools greedily for their expected points
  let restM=0, restV=0;
  const left=Math.max(0, sc.matchesLeft-1);
  if(restPool && left>0){
    const pr=pairing(restPool.ours.filter(x=>x.mid!==A.mid), restPool.theirs.filter(x=>x.mid!==Q.mid), fmt).slice(0,left);
    pr.forEach(({A:a,Q:q})=>{const e=expPts(a,q,fmt);restM+=e.m;restV+=e.v;});
  }
  const mean=sc.us+here.m+restM, sd=Math.sqrt(here.v+restV);
  return {p: 1-normCdf((need-0.5-mean)/(sd||0.5)), projMean:mean, need};
}

/* ---------- MATCHUP: stack-rank all our players vs each of theirs ---------- */
function roster(tid){return (D.teams[tid]||{roster:[]}).roster.filter(p=>p.mid&&p.sl);}
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function niceDate(iso){                       // "2026-09-09" -> "Wed, Sep 9"
  const [y,m,d]=iso.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  return `${DOW[dt.getDay()]}, ${MON[m-1]} ${d}`;
}
function whenLabel(iso,today){
  if(iso===today)return 'Tonight';
  if(iso<today)return 'Played · '+niceDate(iso);
  const days=Math.round((new Date(iso)-new Date(today))/864e5);
  if(days===1)return 'Tomorrow';
  return (days<=7?'This week · ':'Upcoming · ')+niceDate(iso);
}
function fillSchedule(){
  const s=$('#schedSel');
  const sched=D.schedule.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const today=new Date().toISOString().slice(0,10);
  s.innerHTML=sched.map((m,i)=>`<option value="${i}">${niceDate(m.date)} · vs ${esc(m.oppTeam)} · ${m.fmt}-ball</option>`).join('');
  const paint=()=>{
    const m=sched[s.value]; if(!m)return;
    if(live.matchIdx!==s.value){live.matchIdx=s.value;live.outOurs=new Set();live.outTheirs=new Set();live.played=[];live.theirPick=null;}
    $('#schedWhen').textContent=`${whenLabel(m.date,today)} · ${m.fmt}-ball`;
    $('#schedVs').textContent=`vs ${m.oppTeam}`;
    renderMatch(m);
  };
  s.onchange=paint;
  if(!sched.length){$('#matchOut').innerHTML='<div class="card"><p class="sub">No upcoming matches.</p></div>';return;}
  // Default to the NEXT match, not the oldest one on the list — the schedule still contains
  // recently-played dates, and this tab's whole job is "who do we put up this week".
  let idx=sched.findIndex(m=>m.date>=today);
  if(idx<0)idx=sched.length-1;
  s.value=idx;
  paint();
}
function rankRow(pos,A,s){
  const pct=Math.round(s.p*100);
  const r=el('div','rk'+(pos===1?' best':''));
  r.innerHTML=`<div class="pos">${pos}</div>${sl(A.sl)}`+
    `<div class="nm">${esc(A.name)}`+
      (s.h2h&&s.h2h.meetings?`<span class="h2h">${s.h2h.wins}-${s.h2h.meetings-s.h2h.wins} H2H</span>`:'')+
      (s.unrated?`<span class="h2h unrated">unrated</span>`:'')+
      `<span class="dot d-${s.conf}" title="${s.conf} confidence"></span></div>`+
    `<div class="pv ${cls(s.p)}">${pct}%</div>`+
    `<div class="barw" style="grid-column:2/5"><i style="display:block;height:100%;width:${pct}%;background:var(--${s.p>=.55?'good':s.p<=.45?'bad':'even'})"></i></div>`;
  return r;
}
function renderMatch(m){
  const out=$('#matchOut');out.innerHTML='';
  const ours=roster(m.ourTeamId),theirs=roster(m.oppTeamId),fmt=m.fmt;
  // Plan (rank every pairing) vs Live (sequencing companion for during the match).
  const modeBar=el('div','ftabs');modeBar.style.margin='4px 0 0';
  [['plan','Plan'],['live','Live']].forEach(([v,lab])=>{
    const b=el('button','ftab',lab);b.setAttribute('aria-pressed',(live.mode0||'plan')===v);
    b.onclick=()=>{live.mode0=v;renderMatch(m);};modeBar.appendChild(b);});
  out.appendChild(modeBar);
  if(live.mode0==='live'||live.mode0==='lineup'){renderLive(m,out);return;}

  // Compact header: the dropdown directly above already names the date/teams/format, so
  // repeating it full-size just pushed the actual picks below the fold on a phone.
  const head=el('div','card');
  head.innerHTML=`<p class="sub" style="margin:0">Each of their players, with our whole roster ranked
      best-to-worst underneath. The tick on each bar is 50% — past it, we're favored.</p>
    <div class="legend"><span><i class="dot d-high"></i>lots of history</span>
      <span><i class="dot d-med"></i>some</span>
      <span><i class="dot d-low"></i>thin — treat as a guess</span></div>`;
  out.appendChild(head);
  if(!theirs.length){out.appendChild(el('div','card','<p class="sub">No roster posted for this opponent yet.</p>'));return;}

/* Rebuild a player's chronological game log from their head-to-head records — the per-meeting
   logs are carried for our roster, so this is exact, not sampled. */
function gameLog(pr){
  const g=[];
  (pr.headToHead||[]).forEach(o=>(o.games||[]).forEach(x=>g.push(x)));
  return g.sort((a,b)=>a.date.localeCompare(b.date));
}
const STREAK_FRESH_DAYS=75;   // beyond this a run is history, not form
function formOf(pr){
  const g=gameLog(pr);
  if(!g.length)return null;
  const last=g[g.length-1];
  let run=1; const won=last.won;
  for(let i=g.length-2;i>=0&&g[i].won===won;i--)run++;
  const daysSince=Math.round((Date.now()-new Date(last.date))/864e5);
  return {run,won,daysSince,lastDate:last.date,recent:g.slice(-8),total:g.length};
}
function renderStreaks(rows,fmt){
  const items=[];
  rows.forEach(({p,pr})=>{
    const f=formOf(pr); if(!f)return;
    const stale=f.daysSince>STREAK_FRESH_DAYS;
    let kind=null,badge='';
    if(f.won&&f.run>=5){kind='heat';badge='Heat check';}
    else if(f.won&&f.run>=3){kind='fire';badge='On fire';}
    else if(f.won&&f.run===2){kind='warm';badge='Heating up';}
    else if(!f.won&&f.run>=3){kind='cold';badge='Ice cold';}
    if(!kind)return;
    const tier={heat:4,fire:3,warm:2,cold:1}[kind];
    items.push({p,f,kind,badge,stale,rank:tier*100+f.run-(stale?500:0)});
  });
  if(!items.length)return null;
  items.sort((a,b)=>b.rank-a.rank);
  const card=el('div','card');
  card.appendChild(el('h2',null,'<span class="eyebrow">Hot streak</span>'));
  card.appendChild(el('p','sub',`Current runs on the ${fmt}-ball roster — most recent games first, oldest result on the left.`));
  const wrap=el('div','streaks');
  items.forEach(({p,f,kind,badge,stale})=>{
    const row=el('div','strk '+(stale?'':kind));
    const when=stale?`${f.run} straight, but last played ${f.lastDate}`
                    :`${f.run} straight · last played ${f.lastDate}`;
    row.innerHTML=`<span class="strk-badge">${stale?'Cooled off':badge}</span>`+
      `<span class="strk-nm"><span class="strk-top">${sl(p.sl)}<span class="who">${esc(p.name)}</span></span>`+
      `<span class="strk-sub">${when}</span></span>`+
      `<span class="pips">${f.recent.map(g=>`<span class="pip ${g.won?'w':'l'}">${g.won?'W':'L'}</span>`).join('')}</span>`;
    wrap.appendChild(row);
  });
  card.appendChild(wrap);
  return card;
}

/* ---------- LIVE companion: sequencing as an alternating game, not a static assignment ----------
   The Plan view ranks each pairing on its own. At the table the real problem is different:
   APA alternates who throws first each match, and whoever throws is COUNTERED — the other
   side sees the player and answers. So your best asset isn't any one player, it's holding a
   strong flexible player back to counter WITH. An earlier version scored a pick as
   P(win) + a single joint-optimal assignment of everyone left; that assignment is symmetric,
   so it valued your 6 the same whether you burned him blind now or saved him to answer with —
   and it would happily tell you to throw your strongest player up first. Wrong.

   This instead solves the actual game by recursion over (our pool, their pool, whose throw):
     - on OUR throw:  max over A of  min over Q of  [ pWin(A,Q) + value(rest, THEIR throw next) ]
                      (we commit A blind, they counter with their best answer)
     - on THEIR throw: min over Q of  max over A of  [ pWin(A,Q) + value(rest, OUR throw next) ]
                      (they commit Q, we answer with our best)
   Initiative flips every match. Because a state where WE counter pays out max-over-A, the
   solver correctly rewards keeping a strong player in reserve — so it stops throwing the 6. */
const live={matchIdx:null,outOurs:new Set(),outTheirs:new Set(),played:[],mode:'counter',theirPick:null,five:null,theirFive:null};
function pWin(A,Q,fmt){return score(A,Q,fmt).p;}
// Memoized minimax over the remaining lineup. weThrow=true means it's our turn to put a
// player up (and be countered). Returns our total expected match wins over the rest of the
// night under optimal play by both sides. Pools are <=5 a side, so the state space is tiny.
function gameValue(ours,theirs,fmt,weThrow,memo){
  if(!ours.length||!theirs.length)return 0;
  memo=memo||{};
  const key=weThrow+'|'+ours.map(p=>p.mid).sort().join(',')+'|'+theirs.map(p=>p.mid).sort().join(',');
  if(key in memo)return memo[key];
  let best;
  if(weThrow){                       // we commit A, they counter to minimize our total
    best=-1;
    ours.forEach(A=>{
      let worst=Infinity;
      theirs.forEach(Q=>{
        const v=pWin(A,Q,fmt)+gameValue(ours.filter(x=>x.mid!==A.mid),theirs.filter(x=>x.mid!==Q.mid),fmt,false,memo);
        if(v<worst)worst=v;
      });
      if(worst>best)best=worst;
    });
  }else{                             // they commit Q, we answer to maximize our total
    best=Infinity;
    theirs.forEach(Q=>{
      let bestA=-1;
      ours.forEach(A=>{
        const v=pWin(A,Q,fmt)+gameValue(ours.filter(x=>x.mid!==A.mid),theirs.filter(x=>x.mid!==Q.mid),fmt,true,memo);
        if(v>bestA)bestA=v;
      });
      if(bestA<best)best=bestA;
    });
  }
  memo[key]=best;return best;
}
// Raw availability: who's here and not yet played (ignores the locked five).
function livePoolsRaw(m){
  const ours=roster(m.ourTeamId).filter(p=>!live.outOurs.has(String(p.mid))&&!live.played.some(x=>x.our===String(p.mid)));
  const theirs=roster(m.oppTeamId).filter(p=>!live.outTheirs.has(String(p.mid))&&!live.played.some(x=>x.their===String(p.mid)));
  return {ours,theirs};
}
// The pools the engine actually reasons over. Once a five is fielded (chosen in Lineup, or the
// only legal option), both the Lineup optimizer and the Live sequencer work within it — same
// engine, same 23-cap, so their advice never contradicts.
function livePools(m){
  let {ours,theirs}=livePoolsRaw(m);
  if(live.five)ours=ours.filter(p=>live.five.has(String(p.mid)));
  if(live.theirFive)theirs=theirs.filter(p=>live.theirFive.has(String(p.mid)));
  return {ours,theirs};
}
function renderLive(m,host){
  const fmt=m.fmt;
  const wrapCard=el('div','card');
  wrapCard.appendChild(el('h2',null,'<span class="eyebrow">Who\'s here</span>'));
  wrapCard.appendChild(el('p','sub',live.five?'The fielded five is set above — grey out anyone here who still is not playing.':'Tap anyone who is not playing tonight to grey them out.'));
  [['Ours',roster(m.ourTeamId),live.outOurs],['Theirs',roster(m.oppTeamId),live.outTheirs]].forEach(([lab,list,outSet])=>{
    const h=el('div','eyebrow',lab);h.style.marginTop='10px';wrapCard.appendChild(h);
    const row=el('div','chips');
    list.forEach(p=>{
      const gone=outSet.has(String(p.mid))||live.played.some(x=>x.our===String(p.mid)||x.their===String(p.mid));
      const b=el('button','chip avail'+(gone?'':' on'),`${sl(p.sl)}${esc(p.name)}`);
      b.setAttribute('aria-pressed',!gone);
      b.onclick=()=>{const k=String(p.mid);outSet.has(k)?outSet.delete(k):outSet.add(k);renderMatch(m);};
      row.appendChild(b);
    });
    wrapCard.appendChild(row);
  });
  host.appendChild(wrapCard);

  // The lineup optimizer (recommended five / fielded five) — same view, same engine.
  renderLineupSection(m,host);
  const {ours,theirs}=livePools(m);

  // running team score + what we need (the match is decided on TOTAL match points)
  if(live.played.length){
    const M=PMOM[fmt], sc=teamScore(m), need=teamNeed(fmt), pool=M.total*M.matches;
    const scored=live.played.filter(x=>x.ourPts!=null).length;
    const clinched=sc.us>=need, lost=sc.them>(pool-need);
    const sard=el('div','card');
    sard.style.borderColor=clinched?'var(--good)':lost?'var(--bad)':'var(--accent)';
    const stillNeed=Math.max(0,need-sc.us), theyNeed=Math.max(0,(pool-need+1)-sc.them);
    sard.innerHTML=`<div class="eyebrow" style="color:${clinched?'var(--good)':lost?'var(--bad)':'var(--accent)'}">Team score`+
      `${sc.matchesLeft>0?` · ${sc.matchesLeft} match${sc.matchesLeft===1?'':'es'} left`:' · final'}</div>`+
      `<div class="ts-row"><span class="ts-us">${sc.us}</span><span class="ts-dash">—</span><span class="ts-them">${sc.them}</span></div>`+
      `<p class="sub" style="margin-top:2px">Us vs ${esc(m.oppTeam)} · first to ${need} of ${pool} wins`+
      (clinched?' · <b style="color:var(--good)">clinched</b>':lost?' · <b style="color:var(--bad)">out of reach</b>':
        ` · <b>we need ${stillNeed}</b> more (they need ${theyNeed})`)+`</p>`+
      (scored<live.played.length?`<p class="sub" style="color:var(--warn);margin-top:4px">Enter each result below to keep the score live.</p>`:'');
    host.appendChild(sard);

    const pc=el('div','card');
    pc.appendChild(el('h2',null,'<span class="eyebrow">Matches played — tap the result</span>'));
    live.played.forEach((x,i)=>{
      const A=roster(m.ourTeamId).find(p=>String(p.mid)===x.our),Q=roster(m.oppTeamId).find(p=>String(p.mid)===x.their);
      const r=el('div','mrow');
      r.innerHTML=`<div class="who">${A?sl(A.sl)+'<span>'+esc(A.name)+'</span>':'—'}</div>`+
        `<div class="who them"><span>vs ${Q?esc(Q.name):'—'}</span>${Q?sl(Q.sl):''}</div>`;
      const ctr=el('div','mres');
      // Won / Lost sets a default split; a compact select fine-tunes the exact match points.
      [['W',true],['L',false]].forEach(([lab,won])=>{
        const b=el('button','rbtn'+(x.won===won?' on '+(won?'w':'l'):''),lab);
        b.onclick=()=>{x.won=won;x.ourPts=won?Math.round(M.win.m):Math.round(M.loss.m);renderMatch(m);};
        ctr.appendChild(b);
      });
      if(x.won!=null){
        const sel=el('select');sel.className='psel';
        const opts=x.won?M.splits:M.splits.map(v=>M.total-v);   // our points: win 12-20, loss 0-8
        opts.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=`${v}-${M.total-v}`;if(v===x.ourPts)o.selected=true;sel.appendChild(o);});
        sel.onchange=()=>{x.ourPts=+sel.value;renderMatch(m);};
        ctr.appendChild(sel);
      }
      r.appendChild(ctr);
      const u=el('button','rbtn','×');u.title='Remove';
      u.onclick=()=>{live.played.splice(i,1);renderMatch(m);};
      ctr.appendChild(u);
      pc.appendChild(r);
    });
    host.appendChild(pc);
  }

  const c=el('div','card');
  c.appendChild(el('h2',null,'<span class="eyebrow">During the match — who to put up</span>'));
  const tabs=el('div','ftabs');
  [['counter','They threw first'],['throw','We throw first']].forEach(([v,lab])=>{
    const b=el('button','ftab',lab);b.setAttribute('aria-pressed',live.mode===v);
    b.onclick=()=>{live.mode=v;renderMatch(m);};tabs.appendChild(b);});
  c.appendChild(tabs);

  if(!ours.length||!theirs.length){
    c.appendChild(el('p','sub','Everyone is used or marked out — nothing left to decide.'));
    host.appendChild(c);return;
  }

  if(live.mode==='counter'){
    c.appendChild(el('p','sub','Pick who they put up, then take the top counter. Value counts what the pick leaves you for the rest of the night, not just this match.'));
    const pickRow=el('div','chips');
    theirs.forEach(Q=>{
      const b=el('button','chip'+(live.theirPick===String(Q.mid)?' on':''),`${sl(Q.sl)}${esc(Q.name)}`);
      b.setAttribute('aria-pressed',live.theirPick===String(Q.mid));
      b.onclick=()=>{live.theirPick=String(Q.mid);renderMatch(m);};pickRow.appendChild(b);
    });
    c.appendChild(pickRow);
    const Q=theirs.find(x=>String(x.mid)===live.theirPick);
    if(Q){
      const memo={};
      const liveScore=(live.played||[]).some(x=>x.ourPts!=null);
      const ranked=ours.map(A=>{
        const now=pWin(A,Q,fmt);
        const rest=gameValue(ours.filter(x=>x.mid!==A.mid),theirs.filter(x=>x.mid!==Q.mid),fmt,true,memo);
        const ep=expPts(A,Q,fmt), ptw=pTeamWin(m,A,Q,{ours,theirs}).p;
        return {A,now,rest,total:now+rest,edge:provenEdge(A,Q,fmt),ep,ptw};
      }).sort((a,b)=>(b.edge-a.edge)||(liveScore?(b.ptw-a.ptw):(b.total-a.total)));
      // once the score is live, optimize the odds of winning the TEAM match, not raw wins
      if(liveScore){
        const sc=teamScore(m), need=teamNeed(fmt);
        const behind=sc.us<sc.them;
        c.appendChild(el('p','sub',
          `Score is live — ranking by odds of winning the team match. `+
          (behind?`You're behind, so this leans toward the pick that most lifts those odds — often a higher-upside matchup, because a safe coin-flip is not enough when you need points.`
                 :`You're ahead, so it favors the steady pick that best protects the lead.`)));
      }
      const best=ranked[0];
      ranked.forEach((r,i)=>{
        const row=el('div','rk'+(i===0?' best':''));
        const s=score(r.A,Q,fmt);
        const h2hTag=(s.h2h&&s.h2h.meetings?`<span class="h2h">${s.h2h.wins}-${s.h2h.meetings-s.h2h.wins} vs them</span>`:'')+(s.unrated?`<span class="h2h unrated">unrated</span>`:'');
        row.innerHTML=`<div class="pos">${i+1}</div>${sl(r.A.sl)}`+
          `<div class="nm two"><span class="strk-top"><span class="who">${esc(r.A.name)}</span>${h2hTag}<span class="dot d-${s.conf}"></span></span>`+
          `<span class="strk-sub">${Math.round(r.now*100)}% · ~${Math.round(r.ep.m)} pts${liveScore?` · team win ${Math.round(r.ptw*100)}%`:''}</span></div>`+
          (liveScore?`<div class="pv">${Math.round(r.ptw*100)}<span class="pv-u">win</span></div>`
                    :`<div class="pv">${r.total.toFixed(1)}<span class="pv-u">exp</span></div>`);
        attachWhy(row,r.A,Q,fmt);
        c.appendChild(row);
      });
      const bestNow=ranked.slice().sort((a,b)=>b.now-a.now)[0];
      const bestH2H=score(best.A,Q,fmt).h2h;
      if(best.edge>0 && bestH2H){
        const h=bestH2H;
        c.appendChild(el('p','sub',
          `${esc(best.A.name)} is ${h.wins}-${h.meetings-h.wins} against ${esc(Q.name)}, who beats the field otherwise — a record like that against one player is the strongest read there is, so put them up even though the handicap flatters ${esc(bestNow.A.name)}.`));
      } else if(bestNow && bestNow.A.mid!==best.A.mid){
        c.appendChild(el('p','sub',
          `Note: ${esc(bestNow.A.name)} is the better straight matchup (${Math.round(bestNow.now*100)}%), `+
          `but using ${esc(best.A.name)} keeps a stronger set of answers for the rest of the night.`));
      }
      const mark=el('button','ftab','Mark this matchup played');mark.style.marginTop='10px';
      mark.onclick=()=>{live.played.push({our:String(best.A.mid),their:String(Q.mid)});live.theirPick=null;renderMatch(m);};
      c.appendChild(mark);
    }
  }else{
    c.appendChild(el('p','sub','Whoever you throw gets countered, and good handicapping means throw order barely moves the total — so lead with your lowest skill level and keep your matchup-proof players to answer with. A higher player only leads if they are clearly better to throw.'));
    const memo={};
    // SL_HOLD is a penalty per skill level on the throw: you only expose a higher-SL player
    // when their whole-night value beats a lower one by more than this. Because throw order
    // hardly changes expected wins, this makes the app "throw low, hold your strong players to
    // counter" — which is how the game is actually played — while still yielding to a genuinely
    // large edge. cv (mean win odds vs their pool) is only used to name who to keep back.
    const SL_HOLD=0.15;
    const ranked=ours.map(A=>{
      let worst=null;
      theirs.forEach(Q=>{
        const now=pWin(A,Q,fmt);
        // they answered A with Q, so the next match alternates to them throwing first
        const rest=gameValue(ours.filter(x=>x.mid!==A.mid),theirs.filter(x=>x.mid!==Q.mid),fmt,false,memo);
        const tot=now+rest;
        if(worst===null||tot<worst.total)worst={Q,now,rest,total:tot};
      });
      const cv=theirs.reduce((s,Q)=>s+pWin(A,Q,fmt),0)/theirs.length;
      return {A,...worst,cv,adj:worst.total-SL_HOLD*A.sl};
    }).sort((a,b)=>b.adj-a.adj);
    // who you'd most want to keep in reserve = flattest, highest win-odds vs their pool
    const hold=ranked.slice().sort((a,b)=>b.cv-a.cv)[0];
    const spread=Math.max(...ranked.map(r=>r.total))-Math.min(...ranked.map(r=>r.total));
    if(hold && ranked[0].A.mid!==hold.A.mid){
      c.appendChild(el('p','sub',
        `Expected wins run within ${spread.toFixed(2)} across every choice, so throw ${esc(ranked[0].A.name)} `+
        `(SL ${ranked[0].A.sl}) and keep ${esc(hold.A.name)} (SL ${hold.A.sl}) back — they are even-or-better against `+
        `their whole lineup, your best answer to whatever they put up.`));
    }
    ranked.forEach((r,i)=>{
      const row=el('div','rk'+(i===0?' best':''));
      // Headline the number we actually rank on (night value); the single-match odds sit
      // underneath, otherwise a correct sacrificial throw reads as a ranking bug.
      row.innerHTML=`<div class="pos">${i+1}</div>${sl(r.A.sl)}`+
        `<div class="nm two"><span class="who">${esc(r.A.name)}</span>`+
        `<span class="strk-sub">worst case they answer ${esc(r.Q.name)} — ${Math.round(r.now*100)}% that match</span></div>`+
        `<div class="pv">${r.total.toFixed(1)}<span class="pv-u">exp</span></div>`;
      attachWhy(row,r.A,r.Q,fmt);
      c.appendChild(row);
    });
  }
  host.appendChild(c);
}

/* ---------- LINEUP: pick the legal 5 that plays best as a whole ----------
   The Plan tab ranks each matchup in isolation, which is misleading: chasing the single best
   pick can strand the rest of the night at a disadvantage, and you can't even field everyone —
   the five who play cannot exceed 23 combined skill level. This picks the legal five and values
   each candidate by the alternating throw/counter game (both sides play well, initiative
   averaged), so "who remains" is priced in. Matchups are shown as a target; the actual pairings
   get decided by throws (that's the Live tab). */
const SL_CAP=23, TEAM_SIZE=5;
function combos(arr,k){
  if(k===0)return [[]]; if(arr.length<k)return [];
  const [h,...t]=arr;
  return combos(t,k-1).map(c=>[h,...c]).concat(combos(t,k));
}
function sumSL(a){return a.reduce((s,p)=>s+(p.sl||0),0);}
// their likely five: teams tend to field their strongest legal lineup
function likelyFive(pool){
  if(pool.length<=TEAM_SIZE)return pool.slice();
  const legal=combos(pool,TEAM_SIZE).filter(c=>sumSL(c)<=SL_CAP);
  const pick=(legal.length?legal:combos(pool,TEAM_SIZE)).sort((a,b)=>sumSL(b)-sumSL(a))[0];
  return pick;
}
// greedy 1-1 pairing for display only (who we'd aim at whom)
function pairing(O,T,fmt){
  const cells=[];O.forEach(A=>T.forEach(Q=>cells.push([A,Q,pWin(A,Q,fmt)])));
  cells.sort((a,b)=>b[2]-a[2]);
  const uA=new Set(),uQ=new Set(),out=[];
  cells.forEach(([A,Q,p])=>{if(!uA.has(A.mid)&&!uQ.has(Q.mid)){uA.add(A.mid);uQ.add(Q.mid);out.push({A,Q,p});}});
  return out;
}
function lineupValue(O,T,fmt,memo){
  // average of both initiatives — over a real match, who throws first alternates
  return (gameValue(O,T,fmt,true,memo)+gameValue(O,T,fmt,false,memo))/2;
}
// The shared optimizer: the best legal five to field and its value. Used by the Lineup view
// AND offered inside Live, so both run on one engine.
function bestFive(m,fmt){
  const {ours,theirs}=livePoolsRaw(m);
  const their5=likelyFive(theirs);
  let legal=combos(ours,TEAM_SIZE).filter(c=>sumSL(c)<=SL_CAP);
  if(ours.length<TEAM_SIZE)legal=[ours];               // fewer than five here — play them all
  if(!legal.length)return {five:null,their5,ranked:[],ours,theirs};
  const memo={};
  const ranked=legal.map(c=>({c,v:lineupValue(c,their5,fmt,memo)})).sort((a,b)=>b.v-a.v);
  return {five:ranked[0].c,their5,ranked,ours,theirs};
}
function fieldFive(m,c,their5){
  live.five=new Set(c.map(p=>String(p.mid)));
  live.theirFive=new Set(their5.map(p=>String(p.mid)));
}
function renderLineupSection(m,host){
  const fmt=m.fmt;
  // Fielded already? Show it as the locked five with a way to re-open the recommendation.
  if(live.five){
    const names=roster(m.ourTeamId).filter(p=>live.five.has(String(p.mid)));
    const bar=el('div','card');bar.style.borderColor='var(--accent)';
    bar.innerHTML=`<div class="eyebrow" style="color:var(--accent)">Your five · ${sumSL(names)}/${SL_CAP} SL</div>`+
      `<p class="sub" style="margin-top:4px">${names.slice().sort((a,b)=>b.sl-a.sl).map(p=>esc(p.name)+' ('+p.sl+')').join(' · ')}</p>`+
      `<p class="sub" style="margin-top:6px">The picks below sequence just these five. Grey someone out above to reshuffle.</p>`;
    const chg=el('button','ftab','Change five');chg.style.marginTop='8px';
    chg.onclick=()=>{live.five=null;live.theirFive=null;renderMatch(m);};
    bar.appendChild(chg);host.appendChild(bar);
    return;
  }
  const {ours}=livePoolsRaw(m);
  if(ours.length<TEAM_SIZE){
    host.appendChild(el('div','card',`<p class="sub">Mark at least ${TEAM_SIZE} of our players here to build a lineup.</p>`));return;
  }
  const bf=bestFive(m,fmt);
  const their5=bf.their5, ranked=bf.ranked, pool=bf.ours;
  const card=el('div','card');
  card.appendChild(el('h2',null,'<span class="eyebrow">Best five to field</span>'));
  if(!ranked.length){
    card.appendChild(el('p','sub',`Every five of the players marked here totals over ${SL_CAP} skill level — no legal lineup. Grey out a higher skill level.`));
    host.appendChild(card);return;
  }
  const best=ranked[0];
  const bench=pool.filter(p=>!best.c.some(x=>x.mid===p.mid));
  card.appendChild(el('p','sub',
    `Against their likely five (${their5.map(p=>p.sl).sort((a,b)=>b-a).join('/')}, `+
    `${sumSL(their5)} SL). Valued by real throw-and-counter play, so the whole night is weighed — not one pick.`));
  const head=el('div','lu-head');
  head.innerHTML=`<span><b>${best.v.toFixed(1)}</b> expected wins of 5</span>`+
    `<span class="lu-cap ${sumSL(best.c)>SL_CAP?'over':''}">${sumSL(best.c)}/${SL_CAP} SL</span>`;
  card.appendChild(head);
  // target pairings
  const pr=pairing(best.c,their5,fmt);
  const tbl=el('div','lu-pairs');
  pr.slice().sort((a,b)=>b.A.sl-a.A.sl).forEach(({A,Q,p})=>{
    const row=el('div','lu-row');
    row.innerHTML=`<span class="lu-us">${sl(A.sl)}<span class="who">${esc(A.name)}</span></span>`+
      `<span class="lu-pct ${cls(p)}">${Math.round(p*100)}%</span>`+
      `<span class="lu-them"><span class="who">${esc(Q.name)}</span>${sl(Q.sl)}</span>`;
    attachWhy(row,A,Q,fmt);
    tbl.appendChild(row);
  });
  card.appendChild(tbl);
  const go=el('button','ftab','Field these five');
  go.style.marginTop='10px';
  go.onclick=()=>{fieldFive(m,best.c,their5);renderMatch(m);};
  card.appendChild(go);
  if(bench.length){
    card.appendChild(el('p','sub',`Sat down: ${bench.map(p=>esc(p.name)+' ('+p.sl+')').join(', ')} — `+
      `the cap or a weaker fit left them off tonight.`));
  }
  host.appendChild(card);

  // a couple of alternatives so the cap trade-offs are visible
  if(ranked.length>1){
    const alt=el('div','card');
    alt.appendChild(el('h2',null,'<span class="eyebrow">Other legal fives</span>'));
    ranked.slice(1,4).forEach(r=>{
      const row=el('button','lu-alt');row.type='button';
      row.innerHTML=`<span>${r.c.slice().sort((a,b)=>b.sl-a.sl).map(p=>esc(p.name.split(' ')[0])+' '+p.sl).join(' · ')}</span>`+
        `<span class="lu-cap">${sumSL(r.c)}/${SL_CAP}</span><span><b>${r.v.toFixed(1)}</b></span>`;
      row.title='Field this five';
      row.onclick=()=>{fieldFive(m,r.c,their5);renderMatch(m);};
      alt.appendChild(row);
    });
    host.appendChild(alt);
  }
}

/* ---------- Rules reader ----------
   Two bodies of rules, nested: the official APA Team Manual governs play everywhere; the
   Hudson County local bylaws supplement (and in places override) it for this league. Both
   are searchable so a rules argument at the table is settled by reading, not remembering. */
const blState={q:'',view:'bylaws',doc:'game'};
function blHighlight(t,q){
  const h=esc(t);
  if(!q)return h;
  return h.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
}
// Render a searchable accordion of {title, body[]} sections into `host`, sharing one search box.
function ruleSections(host, secs, opts){
  opts=opts||{};
  const head=el('div','card');
  if(opts.eyebrow)head.appendChild(el('h2',null,`<span class="eyebrow">${esc(opts.eyebrow)}</span>`));
  if(opts.sub)head.appendChild(el('p','sub',opts.sub));
  if(opts.pdf){
    const a=el('a','pdf-link');a.href=opts.pdf;a.target='_blank';a.rel='noopener';
    a.innerHTML='📄 Open the full PDF';head.appendChild(a);
  }
  const box=el('div');box.style.marginTop='10px';
  const q=el('input');q.type='search';q.placeholder=opts.placeholder||'Search…';q.value=blState.q;
  box.appendChild(q);head.appendChild(box);
  host.appendChild(head);

  const list=el('div','card');
  const draw=()=>{
    list.innerHTML='';
    const term=blState.q.trim().toLowerCase();
    let shown=0;
    secs.forEach(sec=>{
      const hay=(sec.title+' '+sec.body.join(' ')).toLowerCase();
      if(term&&!hay.includes(term))return;
      shown++;
      const d=el('details','bl-sec');
      if(term)d.open=true;
      const hits=term?sec.body.filter(b=>b.toLowerCase().includes(term)).length:0;
      d.appendChild(el('summary',null,blHighlight(sec.title,term)+
        (term&&hits?`<span class="bl-hit">${hits} match${hits===1?'':'es'}</span>`:'')));
      const b=el('div','bl-body');
      sec.body.forEach(t=>{
        const para=el('p',/^[●•*-]|^\d+[.)]|^[a-z][.)]/.test(t)?'bullet':null,blHighlight(t,term));
        b.appendChild(para);
      });
      d.appendChild(b);
      list.appendChild(d);
    });
    if(!shown)list.appendChild(el('p','sub','Nothing here matches that.'));
  };
  q.oninput=()=>{blState.q=q.value;draw();};
  draw();
  host.appendChild(list);
}
function renderBylawsInto(host){
  const by=(D.league||{}).bylaws||{};
  const secs=by.sections||[];
  if(!secs.length){host.appendChild(el('div','card','<p class="sub">Bylaws not loaded.</p>'));return;}
  ruleSections(host, secs, {
    sub:`${esc(by.source||'Local bylaws')} — Hudson County's local text. These supplement the official APA rules on the other tab and, where they differ, the local bylaw wins.`,
    pdf:by.pdf, placeholder:'Search the bylaws — forfeit, patch, reschedule…'});

  // The playoff bracket is a grid in the PDF that no text extractor survives, so it is
  // hand-transcribed rather than parsed — kept apart from the parsed sections above.
  const ps=by.playoffStructure;
  if(ps&&ps.rows&&ps.rows.length){
    const c=el('div','card');
    c.appendChild(el('h2',null,'<span class="eyebrow">Playoff structure by division size</span>'));
    if(ps.note)c.appendChild(el('p','sub',esc(ps.note)));
    const wrap=el('div','qt-wrap'),t=el('table','qt');
    t.appendChild(el('thead',null,'<tr><th class="who">Teams in division</th><th class="who">Who qualifies</th><th class="who">Bracket</th></tr>'));
    const tb=el('tbody');
    ps.rows.forEach(r=>{
      const tr=el('tr');
      const a=el('td','who',`<strong>${esc(r.teams)}</strong>`);
      const b=el('td','who',esc(r.qualify));b.style.whiteSpace='normal';b.style.position='static';b.style.minWidth='150px';
      const cc=el('td','who',r.structure.map(x=>esc(x)).join('<br>'));cc.style.whiteSpace='normal';cc.style.position='static';cc.style.minWidth='230px';
      tr.appendChild(a);tr.appendChild(b);tr.appendChild(cc);tb.appendChild(tr);
    });
    t.appendChild(tb);wrap.appendChild(t);c.appendChild(wrap);
    host.appendChild(c);
  }
}
function renderOfficialInto(host){
  const off=(D.league||{}).official;
  const docs=(off&&off.docs)||[];
  if(!docs.length){
    const c=el('div','card');
    c.appendChild(el('h2',null,'<span class="eyebrow">Official APA rules</span>'));
    c.appendChild(el('p','sub','Not loaded yet. Drop the official 2026 APA PDFs into the project and they appear here, searchable.'));
    host.appendChild(c);return;
  }
  if(!docs.some(d=>d.key===blState.doc))blState.doc=docs[0].key;
  // segmented control to pick between the two official documents (Game Rules / Team Manual)
  const seg=el('div','ftabs');seg.style.marginBottom='2px';
  docs.forEach(d=>{const b=el('button','ftab',d.label);b.setAttribute('aria-pressed',blState.doc===d.key);
    b.onclick=()=>{blState.doc=d.key;renderRulesTab();};seg.appendChild(b);});
  host.appendChild(seg);
  const doc=docs.find(d=>d.key===blState.doc);
  ruleSections(host, doc.sections, {
    sub:`${esc(doc.source)} — official APA text (© American Poolplayers Association). `+
        (blState.doc==='game'?'The rules of play, straight from the booklet.'
                             :'League operation, the Equalizer handicap system, scoring and tournaments.'),
    pdf: doc.pdf,
    placeholder: blState.doc==='game'
      ? 'Search the game rules — break, foul, safety…'
      : 'Search the manual — coaching, timeout, handicap…'});
}
function renderRulesTab(){
  const out=$('#rulesOut'); out.innerHTML='';
  if(blState.view!=='official'&&blState.view!=='bylaws')blState.view='bylaws';
  const bar=el('div','ftabs');
  [['official','APA rules'],['bylaws','Hudson County']].forEach(([v,lab])=>{
    const b=el('button','ftab',lab);b.setAttribute('aria-pressed',blState.view===v);
    b.onclick=()=>{blState.view=v;renderRulesTab();};bar.appendChild(b);});
  out.appendChild(bar);
  if(blState.view==='official')renderOfficialInto(out);
  else renderBylawsInto(out);
}

/* ---------- Captain's log ----------
   Deliberately walled off from everything else in the app. Every other number comes from
   APA's API and can be checked; this is paper scoring and recollection, so it lives on its
   own screen, says where it came from, and never feeds records, the matchup engine, streaks
   or race qualification. Mixing the two would quietly launder a guess into a statistic. */
function renderLog(host){
  const out=host||$('#teamOut');
  const ps=D.postseason;
  if(!ps||!ps.events||!ps.events.length){
    out.appendChild(el('div','card','<p class="sub">No captain log entries yet.</p>'));return;
  }
  const banner=el('div','card');
  banner.style.borderColor='var(--warn)';
  banner.innerHTML='<div class="eyebrow" style="color:var(--warn)">Hand-recorded</div>'+
    '<p class="sub" style="margin-top:4px">Playoffs and tournaments are scored on paper, so none of this comes from APA. '+
    'It is kept separate on purpose and never counts toward records, streaks or the matchup engine.</p>';
  out.appendChild(banner);

  const pc=el('div','card');
  pc.appendChild(el('h2',null,'<span class="eyebrow">Postseason record</span>'));
  pc.appendChild(el('p','sub','Every Tri-Cup, Gold Cup, playoff and Vegas match on record. Scores are match points, our player first — <b>2-1</b> won but the opponent reached the hill, <b>0-3</b> a shutout loss.'));
  const tally={};
  ps.events.forEach(ev=>ev.matches.forEach(mm=>mm.results.forEach(r=>{
    if(!r.p)return; const t=tally[r.p]=tally[r.p]||{w:0,l:0};
    if(r.result==='W')t.w++; else if(r.result==='L')t.l++;
  })));
  const tw=el('div','tt-wrap'),tt=el('table','tt');
  tt.appendChild(el('thead',null,'<tr><th class="who">Player</th><th>Postseason</th><th>Win %</th></tr>'));
  const tbody=el('tbody');
  Object.entries(tally).sort((a,b)=>{
    const A=a[1],B=b[1]; const ap=A.w/(A.w+A.l||1), bp=B.w/(B.w+B.l||1);
    return (bp-ap)||((B.w+B.l)-(A.w+A.l));
  }).forEach(([k,t])=>{
    const who=(ps.players||{})[k]||{name:k};
    const n=t.w+t.l, pct=n?Math.round(100*t.w/n):0;
    const tr=el('tr');
    tr.innerHTML=`<td class="who"><span class="nm">${esc(who.name)}${who.unresolved?' <span class="qchip unknown">unidentified</span>':''}</span></td>`+
      `<td class="cell ${pct>=55?'win':pct<=45?'lose':'evn'}">${t.w}-${t.l}</td>`+
      `<td class="cell muted">${n?pct+'%':'—'}</td>`;
    tbody.appendChild(tr);
  });
  tt.appendChild(tbody);tw.appendChild(tt);pc.appendChild(tw);

  const log=el('div');log.style.marginTop='14px';
  log.appendChild(el('div','eyebrow','Events'));
  ps.events.slice().reverse().forEach(ev=>{
    const b=el('div','rulebox');
    const res=ev.outcome?`<span class="qchip ${ev.outcome==='won'?'yes':'no'}">${esc(ev.outcome)}</span>`:'';
    const lines=ev.matches.map(mm=>{
      const parts=mm.results.map(r=>{
        const who=r.p?((ps.players||{})[r.p]||{name:r.p}).name:'(forfeit)';
        const mark=r.result==='W'?'<b class="win">W</b>':r.result==='L'?'<b class="lose">L</b>':'<span class="muted">F</span>';
        const extra=[r.scoreRaw?esc(r.scoreRaw):null, r.note?esc(r.note):null].filter(Boolean).join(', ');
        return `${esc(who)} ${mark}${extra?` <span class="muted">(${extra})</span>`:''}`+
               (r.uncertain?' <span class="qchip unknown">unconfirmed</span>':'');
      }).join(' · ');
      return `<div style="margin-top:4px">${ev.matches.length>1?`<span class="muted">Match ${mm.n}:</span> `:''}${parts}`+
             (mm.uncertain?` <span class="qchip unknown">unconfirmed</span>`:'')+`</div>`;
    }).join('');
    b.innerHTML=`<h3>${esc(ev.label)} · ${esc(ev.date)} ${res}</h3>`+
      (ev.note?`<p>${esc(ev.note)}</p>`:'')+lines;
    log.appendChild(b);
  });
  pc.appendChild(log);
  out.appendChild(pc);
}

/* ---------- shell ---------- */
function setMode(m){document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.mode===m));
  $('#m-me').classList.toggle('hide',m!=='me');
  $('#m-team').classList.toggle('hide',m!=='team');
  $('#m-matchup').classList.toggle('hide',m!=='matchup');$('#m-players').classList.toggle('hide',m!=='players');
  $('#m-rules').classList.toggle('hide',m!=='rules');
  if(m==='team')renderTeamOverview();
  if(m==='rules')renderRulesTab();}
function init(){
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.mode));
  $('#pSearch').oninput=e=>fillPlayers(e.target.value);
  $('#pSel').onchange=e=>playersView.render(e.target.value);
  (function(){const r=document.documentElement;let cur=null;try{cur=localStorage.getItem('rs-theme')}catch(e){}
    if(cur)r.setAttribute('data-theme',cur);
    $('#theme').onclick=()=>{const now=r.getAttribute('data-theme');
      const nx=now==='dark'?'light':now==='light'?'dark':(matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark');
      r.setAttribute('data-theme',nx);try{localStorage.setItem('rs-theme',nx)}catch(e){}};})();
  $('#foot').innerHTML=`Data through ${(D.generatedAt||'').slice(0,10)} · ${PL.length.toLocaleString()} players, 8 & 9-ball. Percentages are handicap-adjusted — APA races sit near 50%, so the spread is the signal.`;
  fillMe();fillSchedule();fillPlayers('');
}
(function start(){
  function go(data){D=data;P=D.players;B=D.baselines;GAP=buildGapPriors(B);PL=playerList();init();}
  if(window.APA_DATA){go(window.APA_DATA);}
  else{fetch('./data.json').then(r=>r.json()).then(go).catch(()=>{document.body.innerHTML='<p style="padding:24px">Could not load data.json.</p>';});}
})();
</script>
